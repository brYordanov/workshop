<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="someinput" />
    <script>
      const input = document.getElementById('someinput');
      console.log(input);

      function createBothEdgesThrottle(
        fn,
        delay,
        { isLeading = false, isTrailing = true } = {}
      ) {
        let lastCallTime = 0;
        let timer = null;
        let lastArgs = null;

        return (...args) => {
          lastArgs = args;
          const now = Date.now();

          const remaining = delay - (now - lastCallTime);

          if (remaining <= 0) {
            clearTimeout(timer);
            timer = null;
            lastCallTime = now;
            if (isLeading) {
              fn(...args);
            }
          } else if (!timer) {
            timer = setTimeout(() => {
              fn(...lastArgs);
              timer = null;
              lastCallTime = Date.now();
            }, remaining);
          }
        };
      }

      function reactToInput(e) {
        console.log(e.target.value);
      }
      const crazyShit = createBothEdgesThrottle(reactToInput, 1000);
      input.addEventListener('input', crazyShit);
    </script>
  </body>
</html>
