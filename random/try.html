<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="some" />
    <script>
      const input = document.getElementById('some');
      console.log(input);

      function createThrottledFunc(
        fn,
        delay,
        { isTrailing = true, isLeading = true } = {}
      ) {
        let lastCallTime = 0;
        let timer = null;
        let lastArgs = null;
        return (...args) => {
          lastArgs = args;
          const now = Date.now();
          const remaining = delay - (now - lastCallTime);

          if (remaining <= 0 && isLeading) {
            clearTimeout(timer);
            timer = null;
            fn(...lastArgs);
            lastCallTime = now;
          } else if (!timer && isTrailing) {
            timer = setTimeout(
              () => {
                fn(...lastArgs);
                lastCallTime = Date.now();
                timer = null;
              },
              remaining <= 0 ? delay : remaining
            );
          }
        };
      }

      function reactToInput(e) {
        console.log(e.target.value);
      }

      const throttledReact = createThrottledFunc(reactToInput, 1000);
      input.addEventListener('input', throttledReact);
    </script>
  </body>
</html>
