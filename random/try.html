<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="some" />
    <script>
      const input = document.getElementById('some');
      console.log(input);

      function createThrottledFunc(
        fn,
        delay,
        { isTrailing = true, isLeading = false } = {}
      ) {
        let lastCallTime = 0;
        let timer = null;
        let lastArgs = null;

        return (...args) => {
          lastArgs = args;
          const now = Date.now();

          if (!isLeading) {
            lastCallTime = now;
          }

          const remaining = delay - (now - lastCallTime);

          if (remaining <= 0) {
            clearTimeout(timer);
            fn(...lastArgs);
            lastCallTime = now;
            timer = null;
          } else if (!timer && isTrailing) {
            timer = setTimeout(() => {
              fn(...lastArgs);
              lastCallTime = Date.now();
              timer = null;
            }, remaining);
          }
        };
      }

      function reactToInput(e) {
        console.log(e.target.value);
      }

      const throttledReact = createThrottledFunc(reactToInput, 1000);
      input.addEventListener('input', throttledReact);
    </script>
  </body>
</html>
