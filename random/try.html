<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="some" />
    <script>
      const input = document.getElementById('some');
      console.log(input);

      function createDebouncedFunc(
        fn,
        delay,
        { isTrailing = false, isLeading = true } = {}
      ) {
        let timer = null;
        let shouldTrail = false;

        return (...args) => {
          if (!timer && isLeading) {
            fn(...args);
            shouldTrail = false;
          } else {
            shouldTrail = true;
          }
          clearTimeout(timer);
          timer = setTimeout(() => {
            if (shouldTrail && isTrailing) {
              fn(...args);
            }
            timer = null;
          }, delay);
        };
      }

      function reactToInput(e) {
        console.log(e.target.value);
      }

      const throttledReact = createDebouncedFunc(reactToInput, 1000);
      input.addEventListener('input', throttledReact);
    </script>
  </body>
</html>
